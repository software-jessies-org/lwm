# Sandbox configuration for this project — sourced as bash by `sandbox run`.
# Safe to commit, or add to .gitignore; your call.

# Human-readable name (used for the sandbox hostname / $SANDBOX marker).
SANDBOX_NAME="lwm"

# Default command to launch inside the sandbox. Override at runtime with:
#   sandbox run -- some-other-command
SANDBOX_CMD=(claude)

# Extra READ-WRITE paths beyond the repo. Use for caches some tools insist on
# writing to your real HOME (e.g. "$HOME/.npm", "$HOME/.cargo/registry").
# Everything not listed here (and outside the repo) stays read-only.
EXTRA_RW=(
	# "$HOME/.npm"
)

# Extra READ-ONLY binds, if a tool needs a path the read-only root doesn't
# already cover. Rarely needed. (Linux only — on macOS everything is readable.)
EXTRA_RO=(
)

# Commands masked inside the sandbox. Leave unset to use the built-in default
# (ssh/scp/sftp/su/sudo/doas/telnet/nc/socat/docker/…, plus
# osascript/open/launchctl/crontab/at on macOS). Define it to customise, e.g.
# to allow netcat for a test:  BLOCK=(ssh scp sftp su sudo doas telnet)
# BLOCK=(ssh scp sftp slogin sshfs ssh-agent ssh-add su sudo doas pkexec telnet rsh rlogin rexec nc ncat netcat socat docker podman)

# Auto-skip Claude Code's permission prompts inside the sandbox (adds
# --dangerously-skip-permissions when the launched command is claude). The
# sandbox is the guard rail. Set to 0 for a sensitive repo where you'd rather
# keep confirming — note the sandbox still has internet, so bypassing all
# prompts means the agent could send repo contents out over the network.
BYPASS_PERMISSIONS=1

# Set to 1 to harden the terminal against injection escapes (bwrap
# --new-session). Off by default because it can disrupt some TUIs.
# (Linux only — ignored on macOS.)
SECURE_TTY=0
